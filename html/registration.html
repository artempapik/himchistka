<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація | Geronok Dry Cleaning</title>
    <link rel="stylesheet" href="reestraciya.css">
</head>
<body>

<header class="topbar">
    <div class="container topbar-inner">
        <div class="topbar-brand">
            <span class="brand-title">Geronok Dry Cleaning</span>
        </div>
        <div class="topbar-info">
            <a href="mailto:yuriy.geronok@gmail.com" class="topbar-link">yuriy.geronok@gmail.com</a>
            <span class="topbar-text">0991097731</span>
            <span class="topbar-text">м. Харків, вул. Світла, буд.23</span>
        </div>
        <div class="topbar-actions">
            <a href="golovnui_ekran.html" class="topbar-button topbar-button--secondary">Вихід</a>
            <a href="vhid.html" class="topbar-button">Вхід</a>
        </div>
    </div>
</header>

<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <h1>Реєстрація</h1>
        </div>

        <form class="register-form">
            <div class="form-group">
                <label for="name">Ім'я</label>
                <input 
                    id="name" 
                    type="text" 
                    placeholder="Іван Петренко" 
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    id="email" 
                    type="email" 
                    placeholder="your.email@example.com" 
                    required>
            </div>

            <div class="form-group">
                <label for="phone">Телефон</label>
                <input 
                    id="phone" 
                    type="tel" 
                    placeholder="0501234567" 
                    required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input 
                    id="password" 
                    type="password" 
                    placeholder="••••••••" 
                    required>
            </div>

            <div class="form-group">
                <label for="password-confirm">Підтвердження пароля</label>
                <input 
                    id="password-confirm" 
                    type="password" 
                    placeholder="••••••••" 
                    required>
            </div>

            <button class="btn-register" type="submit">Зареєструватися</button>
        </form>

        <div class="register-footer">
            <p>Вже є обліковим запису? <a href="vhid.html" class="login-link">Увійти</a></p>
        </div>
    </div>
</div>

</body>
</html>
